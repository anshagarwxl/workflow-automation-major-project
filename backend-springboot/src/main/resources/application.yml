server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: event-team-registration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventreg}
    username: ${DB_USERNAME:eventreg}
    password: ${DB_PASSWORD:eventreg}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Camunda 8 (self-managed: Camunda 8 Run locally, the 'orchestration' container in Docker)
camunda:
  client:
    mode: self-managed
    rest-address: ${CAMUNDA_REST_ADDRESS:http://localhost:8080}
    grpc-address: ${CAMUNDA_GRPC_ADDRESS:http://localhost:26500}
    auth:
      method: none

workflow:
  sla:
    # STANDARD = business values (reminder 24 h, escalation 72 h); DEMO = minutes, to show timers live
    preset: ${SLA_PRESET:DEMO}
  mailbox-url: ${MAILBOX_URL:http://localhost:8025}
  operate-url: ${OPERATE_URL:http://localhost:8080/operate}

app:
  seed-demo-data: ${SEED_DEMO_DATA:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    edu.srmist.eventreg: INFO
