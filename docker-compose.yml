# Event Team Registration - complete stack:
#   portal (React/nginx) -> backend (Spring Boot) -> Camunda 8.8 (orchestration + connectors + Elasticsearch)
#   plus PostgreSQL (application data) and Mailpit (SMTP test inbox for the Email connector).
#
#   cp .env.example .env      # then edit the secrets
#   docker compose up -d --build
#
# Portal http://localhost:3000 | Operate/Tasklist http://localhost:8080 (demo/demo) | Mailbox http://localhost:8025

name: event-team-registration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-eventreg}
      POSTGRES_USER: ${DB_USERNAME:-eventreg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # host 5433 avoids clashing with a local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    networks: [eventreg]
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.10}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cat/health | grep -qE 'green|yellow'"]
      interval: 5s
      retries: 40
      start_period: 30s
    networks: [eventreg]
    restart: unless-stopped

  orchestration:   # Zeebe + Operate + Tasklist + Orchestration Cluster REST API
    image: camunda/camunda:${CAMUNDA_VERSION:-8.8.33}
    ports:
      - "8080:8080"     # Operate, Tasklist, REST API
      - "26500:26500"   # gRPC (job workers)
      - "9600:9600"     # health and metrics
    environment:
      JAVA_TOOL_OPTIONS: -Xmx896m
    volumes:
      - camunda-data:/usr/local/camunda/data
      - ./docker/camunda/application.yaml:/usr/local/camunda/config/application.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q 200'"]
      interval: 5s
      retries: 60
      start_period: 40s
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [eventreg]
    restart: unless-stopped

  connectors:   # Out-of-the-box REST and Email connectors used by the BPMN models
    image: camunda/connectors-bundle:${CONNECTORS_VERSION:-8.8.15}
    ports:
      - "8086:8080"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m
      CAMUNDA_CLIENT_MODE: self-managed
      CAMUNDA_CLIENT_GRPC_ADDRESS: http://orchestration:26500
      CAMUNDA_CLIENT_REST_ADDRESS: http://orchestration:8080
      CAMUNDA_CLIENT_AUTH_METHOD: none
      # Only variables with this prefix are exposed as connector secrets: {{secrets.SMTP_HOST}} -> EVENTREG_SECRET_SMTP_HOST
      CAMUNDA_CONNECTOR_SECRETPROVIDER_ENVIRONMENT_PREFIX: EVENTREG_SECRET_
      EVENTREG_SECRET_STUDENT_RECORDS_URL: ${STUDENT_RECORDS_URL:-http://backend:8081}
      EVENTREG_SECRET_SMTP_HOST: ${SMTP_HOST:-mailpit}
      EVENTREG_SECRET_SMTP_PORT: ${SMTP_PORT:-1025}
      EVENTREG_SECRET_SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      EVENTREG_SECRET_SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      EVENTREG_SECRET_SMTP_CRYPTO: ${SMTP_CRYPTO:-NONE}
      EVENTREG_SECRET_SMTP_FROM: ${SMTP_FROM:-noreply@campus.example.edu}
    depends_on:
      orchestration:
        condition: service_healthy
    networks: [eventreg]
    restart: unless-stopped

  mailpit:   # SMTP test inbox: captures every email the Email connector sends
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.21.8}
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks: [eventreg]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend-springboot/Dockerfile
    image: event-team-registration/backend:2.0.0
    ports:
      - "8081:8081"   # REST API, Swagger UI at /swagger-ui.html
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-eventreg}
      DB_USERNAME: ${DB_USERNAME:-eventreg}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CAMUNDA_REST_ADDRESS: http://orchestration:8080
      CAMUNDA_GRPC_ADDRESS: http://orchestration:26500
      SLA_PRESET: ${SLA_PRESET:-DEMO}
      MAILBOX_URL: http://localhost:8025
      OPERATE_URL: http://localhost:8080/operate
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      JAVA_OPTS: -Xmx384m -XX:+UseG1GC
    depends_on:
      postgres:
        condition: service_healthy
      orchestration:
        condition: service_healthy
    networks: [eventreg]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-react
    image: event-team-registration/frontend:2.0.0
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [eventreg]
    restart: unless-stopped

volumes:
  postgres-data:
  elastic-data:
  camunda-data:

networks:
  eventreg:
    name: eventreg
